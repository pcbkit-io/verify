# PCBKit verify on GitLab CI: the same report.py as the GitHub action (github.com/pcbkit-io/verify).
#
#   include:
#     - remote: https://raw.githubusercontent.com/pcbkit-io/verify/v0.1.0/gitlab/pcbkit-verify.gitlab-ci.yml
#   board:
#     extends: .pcbkit-verify
#     variables: { PCBKIT_PROJECT: hardware/main-board, PCBKIT_REQUIRE: layout }
#
# The job fetches report.py of the same tag (PCBKIT_VERIFY_REF), installs the pcbkit release, writes
# pcbkit-report.json (pcbkit-report@1), pcbkit-summary.md and a JUnit file whose test cases are the
# levels, so a merge request's test widget shows which level fails and why. The job fails when the
# gate fails. Anyone can re-check a report's digest with `report.py verify`.
.pcbkit-verify:
  image: python:3.12
  variables:
    PCBKIT_PROJECT: "."
    PCBKIT_REQUIRE: ready
    PCBKIT_STRICT: "false"
    PCBKIT_VERSION: "2026.10.31"   # the pcbkit release this version of the template is tested with
    PCBKIT_BINARY: ""              # a pcbkit already on the runner instead of installing one
    PCBKIT_VERIFY_REF: v0.1.0      # the pcbkit-io/verify tag report.py comes from
    PCBKIT_VERIFY_DIR: ""          # or a copy of the action in the repository (a directory with report.py)
  script:
    - |
      if [ -z "$PCBKIT_VERIFY_DIR" ]; then
        PCBKIT_VERIFY_DIR=/tmp/pcbkit-verify; mkdir -p "$PCBKIT_VERIFY_DIR"
        curl -fsSL "https://raw.githubusercontent.com/pcbkit-io/verify/$PCBKIT_VERIFY_REF/report.py" -o "$PCBKIT_VERIFY_DIR/report.py"
      fi
      if [ -z "$PCBKIT_BINARY" ]; then
        curl -fsSL https://pcbkit.io/install.sh | sh
        PCBKIT_BINARY="$HOME/.local/bin/pcbkit"
      fi
      set +e
      strict=""; [ "$PCBKIT_STRICT" = "true" ] && strict="--strict"
      python3 -I "$PCBKIT_VERIFY_DIR/report.py" run --project "$PCBKIT_PROJECT" --require "$PCBKIT_REQUIRE" $strict \
        --binary "$PCBKIT_BINARY" --out pcbkit-report.json > pcbkit-summary.md
      code=$?
      cat pcbkit-summary.md
      [ -f pcbkit-report.json ] && python3 -I "$PCBKIT_VERIFY_DIR/report.py" junit pcbkit-report.json > pcbkit-junit.xml
      exit $code
  artifacts:
    when: always
    paths: [pcbkit-report.json, pcbkit-summary.md]
    reports:
      junit: pcbkit-junit.xml
